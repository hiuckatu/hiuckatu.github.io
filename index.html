<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ごみ捨てチェッカー</title>
<style>
:root{--bg:#eef1f5;--surface:#fff;--ink:#1c2733;--sub:#6b7785;--line:#dde3ea;--accent:#2457d6;--accent-ink:#fff;--sun:#d33b4a;--sat:#2a6fd0;--today:#e8efff;--other:#f7f9fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--surface:#18212b;--ink:#e8edf2;--sub:#93a0ad;--line:#2a3643;--accent:#6c93ff;--accent-ink:#0c1320;--sun:#ff7a86;--sat:#79a8ff;--today:#1f2e4d;--other:#141c25}}
:root[data-theme="dark"]{--bg:#10161d;--surface:#18212b;--ink:#e8edf2;--sub:#93a0ad;--line:#2a3643;--accent:#6c93ff;--accent-ink:#0c1320;--sun:#ff7a86;--sat:#79a8ff;--today:#1f2e4d;--other:#141c25}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.5}
.app{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
h1{font-size:1.6rem;margin:0 auto 0 0;font-weight:700;letter-spacing:.02em}
h1 small{font-size:.9rem;color:var(--sub);font-weight:400;margin-left:6px}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);background:var(--line);gap:1px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grid{touch-action:pan-y;-webkit-user-select:none;user-select:none;will-change:transform}
.dow{background:var(--surface);text-align:center;padding:8px 0;font-size:.85rem;color:var(--sub)}
.dow:first-child,.cell.sun .num{color:var(--sun)}
.dow:nth-child(7),.cell.sat .num{color:var(--sat)}
.cell{background:var(--surface);min-height:92px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left}
.cell.out{background:var(--other)}
.cell.out .num{opacity:.45}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.num{font-size:.9rem;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cell.today .num{background:var(--accent);color:var(--accent-ink)}
.cell.today{background:var(--today)}
.ev{font-size:.72rem;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:1px 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:.7rem;color:var(--sub)}
.panel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{margin:0 0 10px;font-size:1.1rem}
.list{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.item{display:flex;align-items:center;gap:10px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);padding:6px 10px;border-radius:6px}
.item .t{color:var(--sub);font-size:.85rem;min-width:3.2em}
.item .n{flex:1;min-width:0;overflow-wrap:anywhere}
.item button{padding:2px 8px;font-size:.8rem}
.empty{color:var(--sub);margin:0 0 14px}
form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{flex:1 1 180px;min-width:0;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=time]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.colors{display:flex;gap:6px}
.colors label{cursor:pointer}
.colors input{position:absolute;opacity:0}
.colors span{display:block;width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid transparent}
.colors input:checked+span{border-color:var(--ink)}
.colors input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
textarea{display:block;width:100%;min-height:64px;margin:0 0 14px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#qr{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s}
#qr.show{opacity:1;visibility:visible}
.qrbox{position:relative;background:#fff;padding:48px 20px 20px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.35);line-height:0;transform:scale(.94);transition:transform .3s ease}
#qr.show .qrbox{transform:none}
#qrcode img,#qrcode canvas{width:min(72vmin,320px)!important;height:min(72vmin,320px)!important}
#qrClose{position:absolute;top:8px;right:8px;width:32px;height:32px;padding:0;display:grid;place-items:center;line-height:1;font-size:1.2rem;background:#eef1f5;color:#1c2733;border-color:#dde3ea;border-radius:50%}
#qrOpen{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){#qr,.qrbox{transition:none}}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.dayhead h2{margin:0}
#trashBtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tr{font-size:.7rem;color:var(--accent);white-space:nowrap}
@media (max-width:600px){.trt{display:none}}
@media (max-width:600px){.app{padding:10px}.cell{min-height:64px;padding:3px}.ev{font-size:0;height:6px;padding:0;border:0;background:var(--c);border-radius:3px}.num{width:22px;height:22px;font-size:.8rem}h1{font-size:1.3rem}}
.gbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-bottom:12px}
.gbar label{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--sub)}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:100%}
select:hover{border-color:var(--accent)}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;font-size:.75rem;color:var(--sub)}
.legend[hidden]{display:none}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--g)}
.legend i.rest{border:1px solid var(--sub)}
.gb{display:flex;flex-wrap:wrap;gap:2px}
.g{display:inline-block;font-size:.68rem;line-height:1.4;padding:0 6px;border-radius:999px;background:var(--g);color:#fff;white-space:nowrap}
.g.rest{background:var(--line);color:var(--ink)}
#gdetail{margin-bottom:14px}
#gdetail:empty{display:none}
.gh{font-size:.95rem;margin:0 0 8px}
.gnone{color:var(--sub);margin:0 0 10px}
#gdetail .list{margin-bottom:10px}
.gsum{font-size:.85rem;color:var(--sub)}
.gsum summary{cursor:pointer}
.gsum dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:8px 0 0}
.gsum dt{color:var(--ink)}
.gsum dd{margin:0}
@media (max-width:600px){.g{font-size:0;width:8px;height:8px;padding:0}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title"></h1>
    <button id="prev" aria-label="前の月">‹</button>
    <button id="today">今日</button>
    <button id="next" aria-label="次の月">›</button>
  </header>
  <div class="gbar">
    <label>地区 <select id="district" aria-label="地区"></select></label>
    <div class="legend" id="legend" hidden></div>
  </div>
  <div class="grid" id="grid" role="grid"></div>
  <section class="panel" aria-live="polite">
    <div class="dayhead"><h2 id="dayTitle"></h2><button id="trashBtn" type="button" aria-pressed="false"></button></div>
    <div id="gdetail"></div>
    <ul class="list" id="list"></ul>
    <textarea id="memo" placeholder="この日のメモ（例：ゴミの日）" maxlength="300" aria-label="この日のメモ"></textarea>
    <form id="form">
      <input type="text" id="name" placeholder="予定のタイトル" maxlength="60" required aria-label="予定のタイトル">
      <input type="time" id="time" aria-label="時刻">
      <div class="colors" id="colors"></div>
      <button class="primary" type="submit">予定を追加</button>
    </form>
  </section>
</div>
<div id="qr" role="dialog" aria-modal="true" aria-label="ゴミの日のQRコード" aria-hidden="true">
  <div class="qrbox"><button id="qrClose" type="button" aria-label="QRコードを閉じる">✕</button><div id="qrcode" role="img" aria-label="ゴミの日のQRコード"></div></div>
</div>
<button id="qrOpen" type="button" hidden>QRを表示</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

const GT=[{n:'燃やすごみ',s:'燃やす',c:'#d9482b'},{n:'燃やさないごみ',s:'燃やさない',c:'#2a6fd0'},{n:'資源',s:'資源',c:'#23865a'},{n:'びん',s:'びん',c:'#7a4bd1'}];
const WD='日月火水木金土',DKEY='calendar-district-v1';
let dist='';
try{dist=localStorage.getItem(DKEY)||''}catch(e){}
if(!GD.some(r=>r[0]===dist))dist='';
function mOk(spec,m){return spec.split('/').some(p=>{const a=p.split('-').map(Number);if(a.length===1)return m===a[0];return a[0]<=a[1]?(m>=a[0]&&m<=a[1]):(m>=a[0]||m<=a[1])})}
function hit(rule,wd,nth,m){return rule.split(/\s+/).filter(Boolean).some(t=>{const x=t.match(/^(.)(\d):(.+)$/);return x&&WD.indexOf(x[1])===wd&&+x[2]===nth&&mOk(x[3],m)})}
function collect(k,row){
  if(k<FY[0]||k>FY[1])return null;
  if(k>=REST[0]&&k<=REST[1])return{rest:true,t:[]};
  const [y,m,d]=k.split('-').map(Number);
  const wd=new Date(y,m-1,d).getDay(),nth=Math.ceil(d/7),t=[];
  if(row[3].split(/\s+/).some(w=>w&&WD.indexOf(w)===wd))t.push({i:0});
  if(hit(row[4],wd,nth,m))t.push({i:1});
  if(hit(row[5],wd,nth,m))t.push({i:2,p:d>=29});
  if(hit(row[6],wd,nth,m))t.push({i:3});
  return{t};
}
function curRow(){return GD.find(r=>r[0]===dist)}
function gcell(k){
  const row=curRow();if(!row)return{h:'',l:''};
  const c=collect(k,row);if(!c)return{h:'',l:''};
  if(c.rest)return{h:'<div class="gb"><span class="g rest">休止</span></div>',l:' ごみ収集休止'};
  if(!c.t.length)return{h:'',l:''};
  return{h:'<div class="gb">'+c.t.map(x=>`<span class="g" style="--g:${GT[x.i].c}">${x.p?'容プラ':GT[x.i].s}</span>`).join('')+'</div>',l:' ごみ収集：'+c.t.map(x=>GT[x.i].n+(x.p?'（容プラのみ）':'')).join('、')};
}
function renderG(){
  const el=$('gdetail'),row=curRow();
  $('legend').hidden=!row;
  if(!row){el.innerHTML='';return}
  const c=collect(sel,row);
  let h='<h3 class="gh">'+esc(row[0])+'のごみ収集（'+esc(row[2])+'）</h3>';
  if(!c)h+='<p class="gnone">収集日データは2026年度（2026年4月〜2027年3月）分のみです。</p>';
  else if(c.rest)h+='<p class="gnone">年末年始のため収集はお休みです（12/30〜1/3）。</p>';
  else if(!c.t.length)h+='<p class="gnone">この日の収集はありません。</p>';
  else h+='<ul class="list">'+c.t.map(x=>`<li class="item" style="--c:${GT[x.i].c}"><span class="n">${GT[x.i].n}${x.p?'（容器包装プラスチックのみ）':''}</span></li>`).join('')+'</ul>';
  h+='<details class="gsum"><summary>通常の収集日</summary><dl>'+GT.map((t,i)=>`<dt>${t.n}</dt><dd>${esc(row[7+i])}</dd>`).join('')+'</dl></details>';
  el.innerHTML=h;
}
$('district').innerHTML='<option value="">地区を選択</option>'+[...GD].sort((a,b)=>a[1].localeCompare(b[1],'ja')).map(r=>`<option value="${esc(r[0])}">${esc(r[0])}</option>`).join('');
$('district').value=dist;
$('district').addEventListener('change',e=>{dist=e.target.value;try{localStorage.setItem(DKEY,dist)}catch(_){}render()});
$('legend').innerHTML=GT.map(t=>`<span><i style="--g:${t.c}"></i>${t.n}</span>`).join('')+'<span><i class="rest"></i>休止</span><span>※29日以降の資源は容プラのみ</span>';
function render(){
  const y=view.getFullYear(),m=view.getMonth();
  $('title').innerHTML=y+'年'+(m+1)+'月';
  const first=new Date(y,m,1);
  const start=new Date(y,m,1-first.getDay());
  const rows=Math.ceil((first.getDay()+new Date(y,m+1,0).getDate())/7);
  let h=DOW.map(d=>`<div class="dow" role="columnheader">${d}</div>`).join('');
  for(let i=0;i<rows*7;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const k=ymd(d),list=events[k]||[];
    const cls=['cell'];
    if(d.getMonth()!==m)cls.push('out');
    if(k===ymd(now))cls.push('today');
    if(k===sel)cls.push('sel');
    if(d.getDay()===0)cls.push('sun');
    if(d.getDay()===6)cls.push('sat');
    const g=gcell(k);const shown=list.slice(0,3).map(e=>`<div class="ev" style="--c:${e.c}">${e.t?e.t+' ':''}${esc(e.n)}</div>`).join('');
    const more=list.length>3?`<div class="more">ほか${list.length-3}件</div>`:'';
    h+=`<div class="${cls.join(' ')}" role="gridcell" tabindex="0" data-d="${k}" aria-label="${d.getMonth()+1}月${d.getDate()}日 予定${list.length}件${g.l}"><span class="num">${d.getDate()}</span>${trash[k]?'<span class="tr">🗑<span class="trt"> ゴミの日</span></span>':''}${g.h}${shown}${more}</div>`;
  }
  $('grid').innerHTML=h;
  renderDay();
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderDay(){
  const [y,m,d]=sel.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  $('dayTitle').textContent=m+'月'+d+'日（'+DOW[dt.getDay()]+'）の予定';
  $('memo').value=(memos[sel]||{}).t||'';updateBtn();renderG();
  const list=events[sel]||[];
  $('list').innerHTML=list.length?list.map((e,i)=>`<li class="item" style="--c:${e.c}"><span class="t">${e.t||'終日'}</span><span class="n">${esc(e.n)}</span><button data-i="${i}" aria-label="${esc(e.n)}を削除">削除</button></li>`).join(''):'';
  if(!list.length)$('list').insertAdjacentHTML('afterend','');
  const old=document.querySelector('.empty');if(old)old.remove();
  if(!list.length)$('list').insertAdjacentHTML('beforebegin','<p class="empty">この日の予定はありません。下のフォームから追加できます。</p>');
}
function pick(k){sel=k;const [y,m]=k.split('-').map(Number);if(y!==view.getFullYear()||m-1!==view.getMonth())view=new Date(y,m-1,1);render()}
$('grid').addEventListener('click',e=>{const c=e.target.closest('.cell');if(c)pick(c.dataset.d)});
$('grid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.d){e.preventDefault();pick(e.target.dataset.d);const c=document.querySelector(`[data-d="${sel}"]`);if(c)c.focus()}});
function shift(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}
$('prev').onclick=()=>shift(-1);
$('next').onclick=()=>shift(1);
/* スワイプで月を切り替え（左へスワイプ=翌月、右へスワイプ=前月） */
(function(){
  const g=$('grid'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let sx=0,sy=0,dx=0,mode=0,busy=false;
  const T='transform .18s ease,opacity .18s ease';
  function snap(){g.style.transition=T;g.style.transform='';g.style.opacity=''}
  g.addEventListener('touchstart',e=>{
    if(busy||e.touches.length!==1){mode=3;return}
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;mode=0;g.style.transition='none';
  },{passive:true});
  g.addEventListener('touchmove',e=>{
    if(busy||mode>=2||e.touches.length!==1)return;
    const mx=e.touches[0].clientX-sx,my=e.touches[0].clientY-sy;
    if(mode===0){
      if(Math.abs(mx)<8&&Math.abs(my)<8)return;
      mode=Math.abs(mx)>Math.abs(my)*1.2?1:2;
      if(mode===2)return;
    }
    dx=mx;
    g.style.transform='translateX('+dx+'px)';
    g.style.opacity=String(Math.max(.4,1-Math.abs(dx)/g.offsetWidth));
  },{passive:true});
  function end(cancel){
    if(mode!==1){mode=0;return}
    mode=0;
    const w=g.offsetWidth,go=!cancel&&Math.abs(dx)>Math.max(50,w*.2);
    if(!go){snap();return}
    const dir=dx<0?1:-1;
    if(reduce){g.style.transition='none';g.style.transform='';g.style.opacity='';shift(dir);return}
    busy=true;
    g.style.transition=T;g.style.transform='translateX('+(-dir*w*.5)+'px)';g.style.opacity='0';
    setTimeout(()=>{
      shift(dir);
      g.style.transition='none';g.style.transform='translateX('+(dir*w*.5)+'px)';g.style.opacity='0';
      void g.offsetWidth;
      g.style.transition=T;g.style.transform='';g.style.opacity='';
      setTimeout(()=>{busy=false},200);
    },180);
  }
  g.addEventListener('touchend',()=>end(false));
  g.addEventListener('touchcancel',()=>end(true));
})();
$('today').onclick=()=>{view=new Date(now.getFullYear(),now.getMonth(),1);sel=ymd(now);render()};
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const n=$('name').value.trim();if(!n)return;
  (events[sel]=events[sel]||[]).push({n,t:$('time').value,c:color});
  events[sel].sort((a,b)=>(a.t||'').localeCompare(b.t||''));
  save();$('name').value='';$('time').value='';render();$('name').focus();
});
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  events[sel].splice(+b.dataset.i,1);
  if(!events[sel].length)delete events[sel];
  save();render();
});
$('memo').addEventListener('input',e=>{const t=e.target.value;const o=memos[sel]||{};if(t.trim())memos[sel]={t,d:o.d};else delete memos[sel];saveMemos();updateBtn()});
$('trashBtn').addEventListener('click',()=>{if(trash[sel])delete trash[sel];else trash[sel]=true;saveTrash();render()});
document.getElementById('qrClose').onclick=()=>{qrHide=true;updateBtn()};
document.getElementById('qr').addEventListener('click',e=>{if(e.target===e.currentTarget){qrHide=true;updateBtn()}});
document.getElementById('qrOpen').onclick=()=>{qrHide=false;updateBtn()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('qr').classList.contains('show')){qrHide=true;updateBtn()}});
render();
</script>
